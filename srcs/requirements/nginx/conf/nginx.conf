user nginx;

events {
    worker_connections 1024;
}

http {
	include /etc/nginx/mime.types; # MIME types (standard file formats)
	default_type application/octet-stream;

	upstream wp_upstream {
		server wordpress:9000;
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;

		# Note: You should disable gzip for SSL traffic. Disables compression.
		# See: https://bugs.debian.org/773332
		gzip	off; 

		server_name			${DOMAIN_NAME};

		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_certificate     /etc/nginx/ssl/${DOMAIN_NAME}.crt;
		ssl_certificate_key /etc/nginx/ssl/${DOMAIN_NAME}.key;
    ssl_ciphers         HIGH:!aNULL:!MD5;

		# Root directory for WordPress
		root /var/www/html;
		index index.php index.html index.htm index.nginx-debian.html;

		# configure access & error logs
		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;

		location / {
			# First attempt to serve request as file, then
			# as directory, then fall back to displaying a 404.
			try_files $uri $uri/ =404;
		}

		# pass PHP scripts to FastCGI server
		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
		
			# With php-cgi (or other tcp sockets):
			fastcgi_pass wp_upstream;
		}
	}
}
