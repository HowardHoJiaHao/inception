[www]
; Run PHP-FPM processes as the 'www-data' user and group for security,
; preventing the web server from running with root privileges.
user = www-data
group = www-data

; Listen for FastCGI requests on port 9000 from the 'wordpress' service.
; This allows Nginx to forward PHP requests to this container for processing.
listen = wordpress:9000

; Set the user and group for the socket file, ensuring Nginx can connect.
listen.owner = www-data
listen.group = www-data

; Use a dynamic process manager, which adjusts the number of child processes
; based on server load, which is efficient for varying traffic.
pm = dynamic

; Set the maximum number of concurrent PHP processes to 5.
pm.max_children = 5

; Start with 2 server processes when PHP-FPM launches.
pm.start_servers = 2

; Ensure there is always at least 1 idle process ready to handle a new request.
pm.min_spare_servers = 1

; Do not allow more than 3 idle processes, to conserve resources.
pm.max_spare_servers = 3
