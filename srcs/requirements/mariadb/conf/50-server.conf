[server]
; Specifies an SQL script to be executed when the MariaDB server starts.
; This is used to initialize the database, create users, and set passwords.
init_file = /etc/mysql/init.sql

[mysqld]
#
# * Basic Settings
#

; Run the MariaDB server process as the 'mysql' user for security.
user                    = mysql

; Define the file path for the process ID, used for server management.
pid-file                = /run/mysqld/mysqld.pid

; Set the base directory for the MariaDB installation.
basedir                 = /usr

; Specify the directory where the database data files are stored.
datadir                 = /var/lib/mysql

; Set the directory for temporary files and tables.
tmpdir                  = /tmp

; Bind the MariaDB server to the 'mariadb' service name, allowing other
; containers on the same Docker network to connect to it using this hostname.
bind-address            = mariadb

#
# * Logging and Replication
#

; Enable binary logging, which is essential for replication and point-in-time recovery.
; It records all changes to the database.
server-id              = 1
log_bin                = /var/log/mysql/mysql-bin.log
expire_logs_days       = 10

#
# * Character sets
#

; Set the default character set to utf8mb4, which supports a full range of
; Unicode characters, including emojis. This ensures proper handling of
; international text and special characters.
character-set-server  = utf8mb4
collation-server      = utf8mb4_general_ci

#
# * InnoDB
#

# InnoDB is enabled by default with a 10MB datafile in /var/lib/mysql/.
# Read the manual for more InnoDB related options. There are many!
# Most important is to give InnoDB 80 % of the system RAM for buffer use:
# https://mariadb.com/kb/en/innodb-system-variables/#innodb_buffer_pool_size
#innodb_buffer_pool_size = 8G

# this is only for embedded server
[embedded]

# This group is only read by MariaDB servers, not by MySQL.
# If you use the same .cnf file for MySQL and MariaDB,
# you can put MariaDB-only options here
[mariadb]

# This group is only read by MariaDB-10.11 servers.
# If you use the same .cnf file for MariaDB of different versions,
# use this group for options that older servers don't understand
[mariadb-10.11]
